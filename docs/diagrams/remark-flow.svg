<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 800" width="1760" height="800" role="img"
  aria-label="Путь замечания: запрос заказчика, транзакция и очередь задач в PostgreSQL, воркер, граф триажа LangGraph с двумя циклами и паузой до решения PM, запись решения и продолжение графа">
