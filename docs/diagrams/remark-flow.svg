<polyline class="a" points="1610,368 1610,566"/>
<text class="al" x="1618" y="420" text-anchor="start" >Job resume →</text>
<text class="al" x="1618" y="434" text-anchor="start" >воркер →</text>
<text class="al" x="1618" y="448" text-anchor="start" >Command resume</text>
<text class="lane-t" x="30" y="740" text-anchor="start" >Как читать</text>
<text class="s" x="30" y="762" text-anchor="start" >Каждый вызов модели — generation в трейсе Langfuse; один AgentRun = один трейс, старт и продолжение вместе (traceId = sha256(runId)). Худший случай одного прохода: 1 vision + 2 rewrite + 3 classify + 3 draft = 9 вызовов, 3 поиска.</text>
<text class="s" x="30" y="782" text-anchor="start" >Решение человека записывает RemarksService до resume — один путь записи для REST, WS и MCP; ни одна нода не вызывает verdict или close. «Не та цитата из ТЗ» продолжает тот же прогон из чекпоинта: цитаты в исключения, поиск заново.</text>
<text class="s" x="30" y="802" text-anchor="start" >Ретест — второй граф: pixel_diff кодом → explain моделью на тройке «было / стало / дифф» → закрывает только заказчик. Схемы по addEdge — docs/GRAPH.md.</text>
