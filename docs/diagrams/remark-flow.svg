<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 840" width="1760" height="840" role="img"
  aria-label="Путь одного замечания: заказчик присылает замечание, API одной транзакцией заводит прогон и кладёт задачу в очередь в Postgres, воркер запускает граф LangGraph из десяти нод с двумя циклами, граф засыпает на interrupt до кнопки PM, решение пишется транзакцией и граф продолжается до persist">
  <!-- Схема по docs/GRAPH.md («Триаж», «Как граф запускается») и docs/ARCHITECTURE.md («Путь запроса: триаж»).
       Источник — scratchpad gen_flow.py у агента; править удобнее в SVG напрямую. PNG печатает docs/diagrams/render.mjs. -->
  <defs>
    <linearGradient id="obj" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#2a3ea3"/><stop offset="0.58" stop-color="#1d2d80"/><stop offset="1" stop-color="#16226a"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#141a33" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6280"/>
    </marker>
    <style>
      text { font-family: 'Onest', 'Golos Text', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141a33; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 13px; fill: #5c6280; }
      .lane { fill: rgba(255,255,255,0.55); }
      .lane-t { font-size: 12px; font-weight: 600; fill: #656b89; letter-spacing: 0.08em; text-transform: uppercase; }
      .lane-s { font-size: 11px; fill: #656b89; }
      .paper { fill: #ffffff; stroke: #e1e4ef; stroke-width: 1; filter: url(#sh); }
      .ext { fill: #f4f5fa; stroke: #c9cee0; stroke-width: 1; }
      .node { fill: url(#obj); }
      .node-hitl { fill: #ffffff; stroke: #1d2d80; stroke-width: 2; stroke-dasharray: 5 4; }
      .node-loop { fill: #e9ecfa; stroke: #1d2d80; stroke-width: 1; }
      .t { font-size: 12.5px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #5c6280; }
      .n { font-size: 11px; font-weight: 600; fill: #ffffff; }
      .b { font-size: 10px; fill: rgba(255,255,255,0.8); }
      .n-dark { font-size: 11px; font-weight: 600; fill: #1d2d80; }
      .b-dark { font-size: 10px; fill: #2a3ea3; }
      .a { fill: none; stroke: #5c6280; stroke-width: 1.5; marker-end: url(#arr); }
      .a-dash { stroke-dasharray: 5 4; }
      .al { font-size: 11.5px; fill: #5c6280; paint-order: stroke; stroke: #eef0f6; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1760" height="840" fill="#eef0f6"/>
  <text class="h1" x="30" y="46">Путь одного замечания: от строки журнала до решения PM</text>
  <text class="h2" x="30" y="68">Время идёт слева направо, дорожки — кто действует. Ноды графа — по addEdge в triage.graph.ts; циклы и лимиты — docs/GRAPH.md</text>
