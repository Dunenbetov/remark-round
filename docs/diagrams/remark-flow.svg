<text class="s" x="1050" y="249.0" text-anchor="middle" >цитаты, кнопки «Ждём вашего решения»</text>
<rect class="paper" x="1390" y="211" width="220" height="50" rx="14"/>
<text class="t" x="1500" y="233.0" text-anchor="middle" >WS verdict.approve или POST …/verdict</text>
<text class="s" x="1500" y="249.0" text-anchor="middle" >MCP зовёт тот же REST</text>
