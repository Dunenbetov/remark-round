# Лимит на вход и регистрацию по IP — первая линия; вторая — @nestjs/throttler в API.
limit_req_zone $binary_remote_addr zone=rr_auth:10m rate=60r/m;
limit_req_status 429;

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # Заголовки безопасности SPA (фаза 11). Стили Angular — inline, поэтому style-src 'unsafe-inline';
  # скрипт темы вынесен в theme-init.js, чтобы script-src остался 'self'; кадры приходят как blob: (MediaService).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Комната замечания (socket.io): апгрейд до WebSocket, долгое соединение
  location /api/v1/ws {
    proxy_pass http://api:3000/api/v1/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Вход, регистрация, смена пароля — с лимитом
  location /api/v1/auth/ {
    limit_req zone=rr_auth burst=20 nodelay;
    proxy_pass http://api:3000/api/v1/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API в той же origin: фронт ходит на /api/v1 без CORS
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Сборка Angular хеширует имена файлов: кэш на год; index.html — всегда свежий (expires не трогает add_header выше)
  location ~* \.(js|css|woff2)$ {
    expires 1y;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
