<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>RemarkRound</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rr.theme');
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/golos-text-cyrillic-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/golos-text-latin-wght-normal.woff2" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
