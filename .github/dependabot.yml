# Обновления зависимостей (аудит: supply-chain): npm — по workspace целиком; базовые образы Dockerfile; actions в CI.
# Secret scanning и Dependabot alerts включаются в Settings → Code security репозитория (не файлом).
#
# ПАУЗА до защиты курса (решение владельца 18.09.2026): open-pull-requests-limit: 0 выключает PR с обновлениями
# версий — каждое обновление было отдельной веткой, а PR шли прямо в main, то есть на прод в обход dev.
# Оповещения об уязвимостях (Dependabot alerts) продолжают приходить. Вернуть после Demo Days: limit 0 → 1.
# Когда вернём: PR идут в dev (target-branch), раз в месяц, одним PR на экосистему (groups.all).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    groups:
      all:
        patterns: ['*']
    ignore:
      # Мажоры фреймворков — руками и по одному: Angular, Nest, Prisma, LangGraph
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'prisma'
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      - dependency-name: '@langchain/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    groups:
      all:
        patterns: ['*']
    ignore:
      # Мажор Node — вручную, вместе с .nvmrc и CI, и только после выхода в LTS (Node 26 — конец октября 2026)
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    groups:
      all:
        patterns: ['*']
    ignore:
      # Мажор Node — вручную, вместе с .nvmrc и CI, и только после выхода в LTS (Node 26 — конец октября 2026)
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/mcp
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    groups:
      all:
        patterns: ['*']
    ignore:
      # Мажор Node — вручную, вместе с .nvmrc и CI, и только после выхода в LTS (Node 26 — конец октября 2026)
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    groups:
      all:
        patterns: ['*']
