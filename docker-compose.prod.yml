# RemarkRound — прод на одном сервере (фаза 11, runbook: docs/PROD.md).
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Порты инфраструктуры в базовом файле уже на 127.0.0.1; наружу смотрит только caddy (80/443 → web).
# Обязательные переменные .env: JWT_SECRET, POSTGRES_PASSWORD, PUBLIC_HOST, ADMIN_EMAILS и все секреты Langfuse
# (LANGFUSE_DB_PASSWORD, CLICKHOUSE_PASSWORD, MINIO_ROOT_PASSWORD, REDIS_AUTH, SALT, ENCRYPTION_KEY, NEXTAUTH_SECRET,
# LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_INIT_USER_PASSWORD) — без них compose не стартует.
services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env до первого запуска (потом менять только ALTER USER)}

  api:
    restart: always
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env — openssl rand -hex 32}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-86400}
      SEED_ON_START: 'false'
      DEMO_LOGINS: 'false'
      # Миграции в проде — отдельным шагом перед up (docs/PROD.md): при старте только проверка, что они применены
      MIGRATE_ON_START: 'false'
      # Контур доступа (ADR 006): без администратора в пустой системе некому зарегистрироваться первым
      ADMIN_EMAILS: ${ADMIN_EMAILS:?задайте ADMIN_EMAILS в .env — e-mail администраторов инстанса через запятую}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite_only}
      REGISTRATION_DOMAINS: ${REGISTRATION_DOMAINS:-}
      TRUST_PROXY_HOPS: '2'
      WEB_ORIGIN: https://${PUBLIC_HOST:?задайте PUBLIC_HOST в .env — домен без https://}
      DATABASE_URL: postgresql://remarkround:${POSTGRES_PASSWORD}@postgres:5432/remarkround?connection_limit=10
      LANGFUSE_TRACING_ENVIRONMENT: production
      # UI Langfuse наружу не публикуется: ссылка «Трейс в Langfuse» работает через ssh -L 3000:127.0.0.1:3000
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
    volumes:
      # Именованный том вместо bind-mount демо: кадры и документы живут в docker volume api-storage (бэкап — docs/PROD.md)
      - api-storage:/app/apps/api/storage
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  web:
    restart: always
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  mcp:
    restart: always
    logging: *logging

  # Секреты Langfuse-стека обязательны (аудит: дефолты change-me-local-dev поднимались молча даже под прод-оверлеем)
  langfuse-postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?задайте LANGFUSE_DB_PASSWORD в .env}
    logging: *logging

  clickhouse:
    restart: always
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?задайте CLICKHOUSE_PASSWORD в .env}
    logging: *logging

  minio:
    restart: always
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
    logging: *logging

  redis:
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?задайте REDIS_AUTH в .env}
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_AUTH}
    logging: *logging

  langfuse-worker:
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${SALT:?задайте SALT в .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?задайте ENCRYPTION_KEY в .env — openssl rand -hex 32}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_AUTH: ${REDIS_AUTH}
      TELEMETRY_ENABLED: 'false'
    logging: *logging

  langfuse-web:
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_AUTH: ${REDIS_AUTH}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?задайте NEXTAUTH_SECRET в .env}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?задайте LANGFUSE_PUBLIC_KEY в .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?задайте LANGFUSE_SECRET_KEY в .env}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?задайте LANGFUSE_INIT_USER_PASSWORD в .env}
      TELEMETRY_ENABLED: 'false'
    logging: *logging

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Ежедневный pg_dump в том postgres-backups (restore — docs/PROD.md). Файлы кадров бэкапятся отдельно (том api-storage).
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: remarkround
      POSTGRES_USER: remarkround
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_ON_START: 'TRUE'
      BACKUP_KEEP_DAYS: '14'
      BACKUP_KEEP_WEEKS: '8'
      BACKUP_KEEP_MONTHS: '6'
      HEALTHCHECK_PORT: '8080'
    volumes:
      - postgres-backups:/backups
    logging: *logging

volumes:
  api-storage:
  postgres-backups:
  caddy-data:
  caddy-config:
